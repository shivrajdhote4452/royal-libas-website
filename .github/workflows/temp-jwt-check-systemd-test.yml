name: TEMP - Verify Pre-Deployment JWT Guard Check (99aaa38 Parity) with Real Systemd

on:
  push:
    branches:
      - test/jwt-check-systemd
    paths:
      - .github/workflows/temp-jwt-check-systemd-test.yml

permissions: {}

jobs:
  verify-predeploy-jwt-check-systemd:
    name: Real Systemd & /proc Pre-Deploy Check Verification (Dummy Data Only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Step 0 - Fail closed unless running real systemd PID 1 and real /proc
        run: |
          set -euo pipefail
          pid1_comm="$(ps -p 1 -o comm=)"
          echo "PID 1 comm=${pid1_comm}"
          test "${pid1_comm}" = "systemd"
          uname -a
          systemctl --version | head -n 2

          timeout 45 systemctl is-system-running --wait >/dev/null 2>&1 || true
          sys_state="$(systemctl is-system-running || true)"
          echo "systemd state=${sys_state}"
          case "${sys_state}" in
            running|degraded) ;;
            starting)
              systemctl list-jobs --no-pager || true
              test "$(systemctl is-active systemd-journald)" = "active"
              ;;
            *)
              echo "FAIL: systemd is not active (${sys_state})" >&2
              exit 1
              ;;
          esac

          sudo -n /usr/bin/python3 -I - <<'PY'
          import os, stat, time
          assert os.path.exists("/proc/1/stat"), "/proc/1/stat missing"
          assert os.path.exists("/proc/1/environ"), "/proc/1/environ missing"
          for bin_path in ("/usr/bin/systemctl", "/usr/bin/python3"):
              st = os.stat(bin_path)
              assert stat.S_ISREG(st.st_mode), f"{bin_path} not regular file"
              assert st.st_uid == 0 and (st.st_mode & 0o022) == 0, f"{bin_path} unsafe perms/owner"
          boottime = time.clock_gettime(time.CLOCK_BOOTTIME)
          assert boottime > 0
          assert os.sysconf("SC_CLK_TCK") > 0
          print("PREFLIGHT_REAL_SYSTEMD_AND_PROC_OK")
          PY

      - name: Step 1 - Write exact pre-deployment check script matching commit 99aaa38
        run: |
          set -euo pipefail
          cat <<'PY' > /tmp/jwt_predeploy_check.py
          import os
          import re
          import shlex
          import stat
          import subprocess
          import sys
          import time
          from urllib.parse import urlparse

          GUARD_TARGET_COMMIT = "99aaa38"
          SERVICE_NAME = "royal-libas"
          RELEASE_BACKEND_DIR = "/var/www/royal-libas-releases/current/backend"
          PROC_ROOT = "/proc"
          TRUSTED_SYSTEMCTL_PATHS = ("/usr/bin/systemctl", "/bin/systemctl")
          MIN_TIMING_MARGIN_SECONDS = 60
          MAX_ENV_FILE_BYTES = 1048576

          # Must match backend/app/config.py at commit 99aaa38
          MIN_JWT_SECRET_LENGTH = 32
          _ENV_CANONICAL_MAP = {
              "prod": "production",
              "production": "production",
              "staging": "staging",
              "stage": "staging",
              "dev": "development",
              "development": "development",
              "local": "local",
              "test": "test",
              "testing": "test",
          }
          _DEV_LIKE_MODES = frozenset({"development", "local", "test"})
          _PRODUCTION_CASHFREE_MODES = frozenset({"production", "prod", "live"})
          _PRODUCTION_DOMAIN_MARKERS = ("royallibasbytanya.com",)
          _PRODUCTION_PATH_MARKERS = ("/var/www/royal-libas",)
          _LOOPBACK_HOSTS = frozenset({"localhost", "127.0.0.1", "::1"})

          _KNOWN_WEAK_JWT_SECRETS = frozenset({
              "royal_libas_dev_secret_key_change_in_prod",
              "your_jwt_secret_here",
              "your-jwt-secret-here",
              "changeme",
              "change_me",
              "change-me",
              "secret",
              "jwt_secret",
              "jwt-secret",
              "default",
              "dev_secret",
              "dev-secret",
              "test_secret",
              "test-secret",
              "placeholder",
              "none",
              "null",
              "password",
              "admin",
              "royallibas",
              "royal_libas",
          })
          _PLACEHOLDER_PATTERNS = (
              "your_jwt_secret",
              "your-jwt-secret",
              "change_in_prod",
              "change-in-prod",
              "replace_me",
              "replace-me",
              "placeholder",
          )
          _SEQUENTIAL_PATTERNS = (
              "0123456789abcdefghijklmnopqrstuvwxyz",
              "abcdefghijklmnopqrstuvwxyz0123456789",
              "abcdefghijklmnopqrstuvwxyz",
              "0123456789abcdef",
              "0123456789",
          )
          TARGET_KEYS = (
              "JWT_SECRET",
              "APP_ENV",
              "ENV",
              "CASHFREE_ENVIRONMENT",
              "FRONTEND_URL",
              "BACKEND_PUBLIC_URL",
              "BACKEND_URL",
              "DATABASE_URL",
          )

          def _has_repeating_cycle(value, max_period=12):
              length = len(value)
              upper = min(max_period, length // 2)
              for period in range(1, upper + 1):
                  prefix = value[:period]
                  if (prefix * ((length // period) + 1))[:length] == value:
                      return True
              return False

          def _detect_production_indicators(environ, config_path):
              indicators = []
              cashfree_env = (environ.get("CASHFREE_ENVIRONMENT") or "").strip().lower()
              if cashfree_env in _PRODUCTION_CASHFREE_MODES:
                  indicators.append("cashfree_production")

              for var_name in ("FRONTEND_URL", "BACKEND_PUBLIC_URL", "BACKEND_URL"):
                  url_val = (environ.get(var_name) or "").strip().lower()
                  if url_val and any(domain in url_val for domain in _PRODUCTION_DOMAIN_MARKERS):
                      indicators.append("domain:" + var_name)

              resolved_path = str(config_path).replace("\\", "/").lower()
              if any(marker in resolved_path for marker in _PRODUCTION_PATH_MARKERS):
                  indicators.append("production_release_path")

              raw_db_url = (environ.get("DATABASE_URL") or "").strip()
              if raw_db_url and "YOUR_NEON_DATABASE_URL_HERE" not in raw_db_url:
                  try:
                      parsed = urlparse(raw_db_url)
                      if parsed.scheme.lower().startswith("postgres"):
                          host = (parsed.hostname or "").strip().lower()
                          if host and host not in _LOOPBACK_HOSTS:
                              indicators.append("remote_postgresql")
                  except ValueError:
                      pass
              return indicators

          def classify_jwt_secret_99aaa38(raw_secret):
              """Exact commit 99aaa38 validate_jwt_secret classification without exposing secret/length."""
              if raw_secret is None or not isinstance(raw_secret, str):
                  return False, "missing", "jwt_not_configured"

              stripped = raw_secret.strip()
              if not stripped:
                  return False, "missing", "jwt_empty_or_whitespace"

              lowered = stripped.lower()
              if lowered in _KNOWN_WEAK_JWT_SECRETS:
                  return False, "known placeholder", "jwt_known_default_or_weak"

              if any(pattern in lowered for pattern in _PLACEHOLDER_PATTERNS) or (
                  lowered.startswith("your_") and lowered.endswith("_here")
              ):
                  return False, "known placeholder", "jwt_placeholder_pattern"

              if len(stripped) < MIN_JWT_SECRET_LENGTH or len(stripped.encode("utf-8")) < MIN_JWT_SECRET_LENGTH:
                  return False, "weak", "jwt_below_min_length"

              if (
                  len(set(stripped)) < 6
                  or _has_repeating_cycle(stripped)
                  or any(lowered in (seq * 4) for seq in _SEQUENTIAL_PATTERNS)
              ):
                  return False, "weak", "jwt_trivial_or_repetitive"

              return True, "configured", "passes_99aaa38_heuristics"

          def evaluate_guard_99aaa38(environ, config_path):
              """Evaluate exact commit 99aaa38 resolve_environment_mode + validate_jwt_secret."""
              app_env_raw = (environ.get("APP_ENV") or "").strip().lower()
              env_raw = (environ.get("ENV") or "").strip().lower()

              app_env = _ENV_CANONICAL_MAP.get(app_env_raw, app_env_raw) if app_env_raw else ""
              env_val = _ENV_CANONICAL_MAP.get(env_raw, env_raw) if env_raw else ""

              indicators = _detect_production_indicators(environ, config_path)
              _, jwt_status, jwt_reason = classify_jwt_secret_99aaa38(environ.get("JWT_SECRET"))

              if app_env and env_val and app_env != env_val:
                  return "FAIL", "conflicting_app_env_and_env", jwt_status, "conflicting", indicators

              if not app_env and not env_val:
                  mode_label = "unset"
                  effective_mode = "unset"
              else:
                  effective_mode = app_env or env_val
                  allowed_labels = {"production", "staging", "development", "local", "test"}
                  mode_label = effective_mode if effective_mode in allowed_labels else "custom_non_dev"

              if effective_mode in _DEV_LIKE_MODES and indicators:
                  return "FAIL", "dev_flag_conflicts_with_prod_indicators", jwt_status, mode_label, indicators

              if jwt_status != "configured":
                  return "FAIL", jwt_reason, jwt_status, mode_label, indicators

              return "PASS", jwt_reason, jwt_status, mode_label, indicators

          def find_trusted_systemctl():
              for candidate in TRUSTED_SYSTEMCTL_PATHS:
                  try:
                      st = os.lstat(candidate)
                  except OSError:
                      continue
                  if stat.S_ISLNK(st.st_mode):
                      if st.st_uid != 0:
                          return None, "untrusted_systemctl_symlink_owner"
                      try:
                          target = os.path.realpath(candidate)
                          st = os.stat(target)
                          check_path = target
                      except OSError:
                          return None, "unresolvable_systemctl_symlink"
                  else:
                      check_path = candidate
                  if not stat.S_ISREG(st.st_mode):
                      return None, "systemctl_not_regular_file"
                  if st.st_uid != 0 or (st.st_mode & 0o022) != 0:
                      return None, "untrusted_systemctl_ownership_or_perms"
                  if not os.access(check_path, os.X_OK):
                      return None, "systemctl_not_executable"
                  return check_path, None
              return None, "trusted_systemctl_not_found"

          def parse_dotenv_fail_closed(path):
              """Strict non-evaluating .env parser using O_PATH fd pinning + /proc/self/fd reopen."""
              o_path = getattr(os, "O_PATH", None)
              o_nofollow = getattr(os, "O_NOFOLLOW", None)
              if o_path is None or o_nofollow is None:
                  return None, "unsafe_open_primitives_unavailable"

              path_fd = -1
              fd = -1
              try:
                  real_path = os.path.realpath(path)
                  if not real_path or real_path in ("/proc", "/sys", "/dev") or real_path.startswith(("/proc/", "/sys/", "/dev/")):
                      return None, "untrusted_special_path"

                  path_fd = os.open(real_path, o_path | o_nofollow)
                  st1 = os.fstat(path_fd)
                  if not stat.S_ISREG(st1.st_mode):
                      return None, "not_regular_file"
                  if (st1.st_mode & 0o002) != 0:
                      return None, "world_writable_env_file"
                  if st1.st_size > MAX_ENV_FILE_BYTES:
                      return None, "env_file_too_large"

                  proc_fd_path = "/proc/self/fd/" + str(path_fd)
                  resolved_kernel_path = os.readlink(proc_fd_path)
                  if resolved_kernel_path != real_path or resolved_kernel_path.startswith(("/proc/", "/sys/", "/dev/")):
                      return None, "path_race_or_mismatch"

                  ro_flags = os.O_RDONLY | getattr(os, "O_NOCTTY", 0) | getattr(os, "O_NONBLOCK", 0)
                  fd = os.open(proc_fd_path, ro_flags)
                  os.close(path_fd)
                  path_fd = -1

                  st2 = os.fstat(fd)
                  if not stat.S_ISREG(st2.st_mode):
                      return None, "not_regular_file"
                  if st2.st_dev != st1.st_dev or st2.st_ino != st1.st_ino:
                      return None, "fd_inode_mismatch"
                  if (st2.st_mode & 0o002) != 0:
                      return None, "world_writable_env_file"
                  if st2.st_size > MAX_ENV_FILE_BYTES:
                      return None, "env_file_too_large"

                  with os.fdopen(fd, "r", encoding="utf-8", errors="strict") as f:
                      fd = -1
                      lines = f.read().splitlines()
              except Exception as exc:
                  return None, type(exc).__name__
              finally:
                  for d in (fd, path_fd):
                      if d != -1:
                          try:
                              os.close(d)
                          except OSError:
                              pass

              out = {}
              seen_counts = {}
              for line in lines:
                  s = line.strip()
                  if not s or s.startswith("#"):
                      continue
                  if s.startswith("export "):
                      s = s[7:].strip()
                  if "=" not in s:
                      return None, "ambiguous_dotenv_line_syntax"
                  k, raw_v = s.split("=", 1)
                  k = k.strip()
                  if not re.match(r"^[A-Za-z_][A-Za-z0-9_]*$", k):
                      return None, "ambiguous_dotenv_key"
                  seen_counts[k] = seen_counts.get(k, 0) + 1
                  if seen_counts[k] > 1 and k in TARGET_KEYS:
                      return None, "duplicate_key_" + k

                  v = raw_v.strip()
                  if len(v) >= 2 and v[0] in ('"', "'") and v[-1] == v[0]:
                      quote_char = v[0]
                      inner = v[1:-1]
                      if "\\" in inner or "${" in inner or "`" in inner or quote_char in inner:
                          if k in TARGET_KEYS:
                              return None, "ambiguous_quoted_value_" + k
                      out[k] = inner
                  elif v.startswith('"') or v.startswith("'"):
                      return None, "ambiguous_multiline_or_unclosed_quote"
                  else:
                      if any(ch in v for ch in ("#", "${", "`", '"', "'")) or any(ch.isspace() for ch in v):
                          if k in TARGET_KEYS:
                              return None, "ambiguous_unquoted_value_" + k
                      out[k] = v

              return {"values": out, "mtime": st2.st_mtime, "realpath": real_path}, None

          def query_systemd(systemctl_path, svc):
              props = [
                  "MainPID",
                  "ActiveState",
                  "SubState",
                  "WorkingDirectory",
                  "Environment",
                  "EnvironmentFiles",
                  "NeedDaemonReload",
              ]
              cmd = [systemctl_path, "show", svc, "--no-pager"]
              for p in props:
                  cmd.extend(["-p", p])
              safe_env = {"PATH": "/usr/sbin:/usr/bin:/sbin:/bin", "LC_ALL": "C"}
              try:
                  res = subprocess.run(cmd, capture_output=True, text=True, timeout=10, env=safe_env, shell=False)
              except Exception as exc:
                  return None, type(exc).__name__
              if res.returncode != 0:
                  return None, "systemctl_rc_" + str(res.returncode)
              parsed = {}
              multi_env_files = []
              multi_env_inline = []
              for line in res.stdout.splitlines():
                  if "=" in line:
                      k, v = line.split("=", 1)
                      k = k.strip()
                      v = v.strip()
                      if k == "EnvironmentFiles":
                          if v:
                              multi_env_files.append(v)
                      elif k == "Environment":
                          if v:
                              multi_env_inline.append(v)
                      else:
                          parsed[k] = v
              parsed["EnvironmentFilesList"] = multi_env_files
              parsed["Environment"] = " ".join(multi_env_inline)
              return parsed, None

          def parse_systemd_env_prop(raw_env):
              out = {}
              if not raw_env:
                  return out, None
              try:
                  tokens = shlex.split(raw_env)
              except ValueError:
                  return None, "ambiguous_systemd_environment_syntax"
              for tok in tokens:
                  if "=" not in tok:
                      return None, "ambiguous_systemd_environment_token"
                  k, v = tok.split("=", 1)
                  out[k] = v
              return out, None

          def parse_systemd_env_files(raw_files):
              files = []
              s = (raw_files or "").strip()
              if not s:
                  return files, None
              pattern = re.compile(r"(\S+)\s+\(ignore_errors=(yes|no)\)")
              pos = 0
              for m in pattern.finditer(s):
                  if s[pos:m.start()].strip():
                      return None, "ambiguous_systemd_envfiles_syntax"
                  fpath = m.group(1)
                  optional = (m.group(2) == "yes")
                  if fpath.startswith("-"):
                      fpath = fpath[1:]
                      optional = True
                  files.append((fpath, optional))
                  pos = m.end()
              if s[pos:].strip():
                  return None, "ambiguous_systemd_envfiles_syntax"
              return files, None

          def read_proc_environ(pid):
              if not pid or not pid.isdigit() or int(pid) <= 0:
                  return None, "no_main_pid"
              ep = os.path.join(PROC_ROOT, pid, "environ")
              try:
                  with open(ep, "rb") as f:
                      raw = f.read().split(b"\x00")
                  out = {}
                  for item in raw:
                      if b"=" in item:
                          k, v = item.split(b"=", 1)
                          key = k.decode("utf-8", "ignore")
                          val = v.decode("utf-8", "ignore")
                          if key in out and key in TARGET_KEYS:
                              return None, "duplicate_proc_key_" + key
                          out[key] = val
                  return out, None
              except Exception as exc:
                  return None, type(exc).__name__

          def get_process_start_epoch(pid):
              if not pid or not pid.isdigit() or int(pid) <= 0:
                  return None, "no_main_pid"
              clk_boottime = getattr(time, "CLOCK_BOOTTIME", None)
              if clk_boottime is None or not hasattr(time, "clock_gettime") or not hasattr(os, "sysconf"):
                  return None, "clock_boottime_unavailable"
              stat_path = os.path.join(PROC_ROOT, pid, "stat")
              try:
                  with open(stat_path, "rb") as f:
                      raw = f.read()
                  rparen = raw.rfind(b")")
                  if rparen == -1:
                      return None, "malformed_proc_stat"
                  after = raw[rparen + 2 :].split()
                  start_ticks = int(after[19])
                  clk_tck = os.sysconf("SC_CLK_TCK")
                  boottime_now = time.clock_gettime(clk_boottime)
                  proc_age = boottime_now - (float(start_ticks) / float(clk_tck))
                  if proc_age < 0:
                      return None, "negative_proc_age"
                  return time.time() - proc_age, None
              except Exception as exc:
                  return None, type(exc).__name__

          def emit_unable(reason, service_state="unknown/unknown", stray="unknown", live_note="predeploy_unverified"):
              print("guard_target_commit=" + GUARD_TARGET_COMMIT)
              print("service_state=" + service_state)
              print("predeploy_guard_verdict=unable to verify")
              print("predeploy_guard_reason=" + reason)
              print("jwt_startup_status=unable to verify")
              print("jwt_startup_source=" + reason)
              print("environment_mode=unable to verify")
              print("prod_indicators=unable to verify")
              print("stray_release_root_dotenv=" + stray)
              print("live_runtime_status=unable to verify")
              print("live_runtime_note=" + live_note)

          def main():
              sc_path, sc_err = find_trusted_systemctl()
              if sc_err:
                  emit_unable(sc_err)
                  return

              sysd, sysd_err = query_systemd(sc_path, SERVICE_NAME)
              if sysd_err:
                  emit_unable(sysd_err)
                  return

              main_pid = sysd.get("MainPID", "0")
              active_state = sysd.get("ActiveState", "unknown")
              sub_state = sysd.get("SubState", "unknown")
              service_state = active_state + "/" + sub_state
              need_reload = sysd.get("NeedDaemonReload", "unknown")
              work_dir = sysd.get("WorkingDirectory", "") or ""

              sysd_env_map, sysd_env_err = parse_systemd_env_prop(sysd.get("Environment", ""))
              sysd_env_files = []
              sysd_env_files_err = None
              for ef_line in sysd.get("EnvironmentFilesList", []):
                  part_files, part_err = parse_systemd_env_files(ef_line)
                  if part_err:
                      sysd_env_files_err = part_err
                      break
                  sysd_env_files.extend(part_files)

              sysd_file_maps = []
              sysd_file_mtimes = []
              sysd_file_err = sysd_env_files_err
              if sysd_file_err is None:
                  for fpath, optional in sysd_env_files:
                      parsed_ef, ef_err = parse_dotenv_fail_closed(fpath)
                      if parsed_ef is None:
                          if optional and ef_err == "FileNotFoundError":
                              continue
                          sysd_file_err = ef_err
                          break
                      sysd_file_mtimes.append(parsed_ef["mtime"])
                      sysd_file_maps.append(parsed_ef["values"])

              try:
                  if not os.path.exists(RELEASE_BACKEND_DIR):
                      emit_unable("release_backend_dir_missing", service_state=service_state)
                      return
                  release_backend_real = os.path.realpath(RELEASE_BACKEND_DIR)
                  release_root_dir = os.path.dirname(release_backend_real)
              except OSError as exc:
                  emit_unable("release_path_" + type(exc).__name__, service_state=service_state)
                  return

              candidates = [
                  ("release_root_dotenv", os.path.join(release_root_dir, ".env")),
                  ("release_backend_dotenv", os.path.join(release_backend_real, ".env")),
              ]
              if work_dir:
                  candidates.append(("systemd_workdir_dotenv", os.path.join(work_dir, ".env")))

              winning_label = None
              winning_path = None
              winning_parsed = None
              winning_err = None
              dangling_err = None
              stray_root_dotenv = False

              for label, cpath in candidates:
                  if os.path.lexists(cpath) and not os.path.exists(cpath):
                      if winning_path is None:
                          dangling_err = "dangling_dotenv_symlink_" + label
                      if label == "release_root_dotenv":
                          stray_root_dotenv = True
                      continue
                  if os.path.exists(cpath):
                      if label == "release_root_dotenv":
                          stray_root_dotenv = True
                      if winning_path is None:
                          winning_label = label
                          winning_path = cpath
                          winning_parsed, winning_err = parse_dotenv_fail_closed(cpath)

              workdir_ambiguous = (winning_path is None and dangling_err is None and not work_dir)
              config_path_real = os.path.join(release_backend_real, "app", "config.py")
              if "/var/www/royal-libas" in RELEASE_BACKEND_DIR and "/var/www/royal-libas" not in config_path_real:
                  config_path_real = os.path.join(RELEASE_BACKEND_DIR, "app", "config.py")

              def resolve_effective_startup():
                  if need_reload == "yes":
                      return None, None, "systemd_daemon_reload_needed"
                  if sysd_env_err:
                      return None, None, sysd_env_err
                  if sysd_file_err:
                      return None, None, "systemd_envfile_" + sysd_file_err
                  if dangling_err:
                      return None, None, dangling_err
                  if workdir_ambiguous:
                      return None, None, "missing_systemd_working_directory"
                  if winning_path is not None and winning_parsed is None:
                      return None, None, "dotenv_" + str(winning_err)

                  dotenv_vals = winning_parsed["values"] if winning_parsed is not None else {}
                  merged = {}
                  jwt_source = "absent_in_systemd_and_" + (winning_label if winning_label else "no_dotenv")

                  for k in TARGET_KEYS:
                      in_inline = k in sysd_env_map
                      file_hits = [m[k] for m in sysd_file_maps if k in m]
                      if len(file_hits) > 1:
                          return None, None, "multiple_systemd_envfiles_set_" + k
                      in_file = len(file_hits) == 1
                      if in_inline and in_file:
                          return None, None, "ambiguous_systemd_inline_vs_envfile_order_" + k
                      if in_inline:
                          merged[k] = sysd_env_map[k]
                          if k == "JWT_SECRET":
                              jwt_source = "systemd_inline_environment"
                      elif in_file:
                          merged[k] = file_hits[0]
                          if k == "JWT_SECRET":
                              jwt_source = "systemd_environment_file"
                      elif k in dotenv_vals:
                          merged[k] = dotenv_vals[k]
                          if k == "JWT_SECRET":
                              jwt_source = str(winning_label)

                  return merged, jwt_source, None

              effective_env, jwt_source, resolve_err = resolve_effective_startup()

