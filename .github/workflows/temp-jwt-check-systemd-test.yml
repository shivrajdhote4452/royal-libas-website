          os.mkfifo(SHARED_BACKEND + "/.env", 0o600)
          os.symlink(SHARED_BACKEND + "/.env", RELEASE_BACKEND + "/.env")
          write_unit(["WorkingDirectory=/var/www/royal-libas-releases/current/backend"])
          assert_case("fifo_at_dotenv_fails_closed", {
              "predeploy_guard_verdict": "unable to verify",
              "predeploy_guard_reason": "dotenv_not_regular_file",
          })

          reset_fs()
          os.symlink("/dev/null", RELEASE_BACKEND + "/.env")
          write_unit(["WorkingDirectory=/var/www/royal-libas-releases/current/backend"])
          assert_case("dev_null_symlink_fails_closed", {
              "predeploy_guard_verdict": "unable to verify",
              "predeploy_guard_reason": "dotenv_untrusted_special_path",
          })

          # 14. Concurrent atomic swap race between valid file, FIFO, /dev/null symlink, broken symlink
          reset_fs()
          write_env_file(SHARED_BACKEND + "/.env", f"JWT_SECRET={DUMMY_SECRET_47}\n", backdate=True)
          os.symlink(SHARED_BACKEND + "/.env", RELEASE_BACKEND + "/.env")
          write_unit(["WorkingDirectory=/var/www/royal-libas-releases/current/backend"])

          stop_race = threading.Event()
          def race_worker():
              idx = 0
              tmp_p = SHARED_BACKEND + "/.race_tmp"
              while not stop_race.is_set():
                  try:
                      if os.path.lexists(tmp_p):
                          os.unlink(tmp_p)
                      mode = idx % 4
                      if mode == 0:
                          with open(tmp_p, "w", encoding="utf-8") as rf:
                              rf.write(f"JWT_SECRET={DUMMY_SECRET_47}\n{DUMMY_CANARY_KEY}\n")
                          os.chmod(tmp_p, 0o600)
                      elif mode == 1:
                          os.mkfifo(tmp_p, 0o600)
                      elif mode == 2:
                          os.symlink("/dev/null", tmp_p)
                      else:
                          os.symlink("/nonexistent_race_target", tmp_p)
                      os.replace(tmp_p, SHARED_BACKEND + "/.env")
                  except OSError:
                      pass
                  idx += 1

          racer = threading.Thread(target=race_worker, daemon=True)
          racer.start()
          race_counts = {}
          try:
              for _ in range(30):
                  kv, raw = invoke_exact_check()
                  verdict = kv.get("predeploy_guard_verdict")
                  reason = kv.get("predeploy_guard_reason", "")
                  assert verdict in {"PASS", "unable to verify"}, f"Unexpected verdict during race: {raw}"
                  race_counts[f"{verdict}:{reason}"] = race_counts.get(f"{verdict}:{reason}", 0) + 1
          finally:
              stop_race.set()
              racer.join(timeout=2)
          scenarios.append("concurrent_swap_race")
          print(f"PASS: concurrent_swap_race :: counts={race_counts}")

          # Cleanup ephemeral test service
          run(["systemctl", "stop", "royal-libas"], check=False)
          if os.path.exists(UNIT_PATH):
              os.unlink(UNIT_PATH)
          run(["systemctl", "daemon-reload"], check=False)
          print(f"ALL {len(scenarios)} PREDEPLOY_REAL_SYSTEMD_SCENARIOS_PASSED")
          TEST_DRIVER
