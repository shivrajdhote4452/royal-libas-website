          # 19. Concurrent atomic swap race between regular file, real FIFO, /dev/null symlink, and broken symlink
          import threading
          reset_fs()
          write_env_file(SHARED_BACKEND + "/.env", f"JWT_SECRET={DUMMY_SECRET_47}\n", backdate=True)
          os.symlink(SHARED_BACKEND + "/.env", RELEASE_BACKEND + "/.env")
          write_unit(["WorkingDirectory=/var/www/royal-libas-releases/current/backend"])

          stop_race = threading.Event()
          def race_worker():
              idx = 0
              tmp_p = SHARED_BACKEND + "/.race_tmp"
              while not stop_race.is_set():
                  try:
                      if os.path.lexists(tmp_p):
                          os.unlink(tmp_p)
                      mode = idx % 4
                      if mode == 0:
                          with open(tmp_p, "w", encoding="utf-8") as rf:
                              rf.write(f"APP_ENV=production\nJWT_SECRET={DUMMY_SECRET_47}\n{DUMMY_CANARY_KEY}\n")
                          os.chmod(tmp_p, 0o600)
                      elif mode == 1:
                          os.mkfifo(tmp_p, 0o600)
                      elif mode == 2:
                          os.symlink("/dev/null", tmp_p)
                      else:
                          os.symlink("/nonexistent_race_target", tmp_p)
                      os.replace(tmp_p, SHARED_BACKEND + "/.env")
                  except OSError:
                      pass
                  idx += 1

          racer = threading.Thread(target=race_worker, daemon=True)
          racer.start()
          race_counts = {}
          try:
              for _ in range(30):
                  kv, raw = invoke_exact_operator_check()
                  st = kv.get("configured_startup_status")
                  src = kv.get("configured_startup_source", "")
                  assert st in {"configured", "missing", "unable to verify"}, f"Unexpected status during race: {raw}"
                  if st == "configured":
                      assert src == "release_backend_dotenv", f"Unexpected configured source: {raw}"
                  elif st == "missing":
                      assert src == "absent_in_systemd_and_no_dotenv", f"Unexpected missing source: {raw}"
                  else:
                      assert src.startswith("dotenv_"), f"Unexpected unable_to_verify source: {raw}"
                  key = f"{st}:{src}"
                  race_counts[key] = race_counts.get(key, 0) + 1
          finally:
              stop_race.set()
              racer.join(timeout=2)
          scenarios.append("real_linux_concurrent_swap_race")
          print(f"PASS: real_linux_concurrent_swap_race :: counts={race_counts}")

