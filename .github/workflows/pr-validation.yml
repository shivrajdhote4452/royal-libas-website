name: PR Validation & Test Suite

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - development

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Isolated Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: royal_libas_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d royal_libas_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run isolated bulk inventory and postgres tests
        env:
          TEST_POSTGRES_URL: postgresql+psycopg2://test_user:test_password@127.0.0.1:5432/royal_libas_test_db
        run: |
          python -m unittest discover backend/tests -p "test_bulk_inventory_adjustment.py"
          python -m unittest discover backend/tests -p "test_curated_moments.py"
          python -m unittest discover backend/tests -p "test_size_chart_safety.py"
          python backend/tests/test_bulk_inventory_adjustment.py
          python backend/tests/test_postgres_concurrency.py

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

